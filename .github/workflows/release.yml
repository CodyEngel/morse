name: Release

# Publishing from CI rather than a laptop is what makes provenance possible:
# npm derives the attestation from the runner's OIDC identity, so there is no
# provider to attest to when the same command runs locally.
on:
  push:
    tags: ["v*"]

jobs:
  # The gate runs before the publish job and on more than one Node, because the
  # engines floor is a promise to users and nothing else proves it on the exact
  # commit being published. `npm ci` runs `prepare`, so this also proves the
  # build works on both.
  test:
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the `engines` floor (package.json), set deliberately in
        # 0cb7485 to where node:sqlite is usable without a flag. It is here
        # because CI's per-PR matrix does not gate a release: without this leg
        # a floor-only regression publishes green and breaks exactly the users
        # least equipped to diagnose it. Do not drop it to simplify the matrix.
        node: ["22.13.0", "24.x"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # See ci.yml: under a solution tsconfig, `--noEmit` typechecks nothing.
      - run: npx tsc --build --force
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi

      # No NODE_AUTH_TOKEN: npm trusts this workflow's OIDC identity, configured
      # as a trusted publisher on the package. Provenance comes with it, so the
      # flag is redundant here but harmless and explicit.
      #
      # Falling back to a token instead? Set an NPM_TOKEN secret and add:
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance
