name: Release

# Publishing from CI rather than a laptop is what makes provenance possible:
# npm derives the attestation from the runner's OIDC identity, so there is no
# provider to attest to when the same command runs locally.
#
# Each package is configured as a trusted publisher pointing at this file by
# name. Renaming this workflow means reconfiguring all three on npmjs.com, and
# nothing here will tell you that until a release fails.
on:
  push:
    tags: ["v*"]

jobs:
  # The gate runs before the publish job and on more than one Node, because the
  # engines floor is a promise to users and nothing else proves it on the exact
  # commit being published. `npm ci` runs `prepare`, so this also proves the
  # build works on both.
  test:
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the `engines` floor (package.json), set deliberately in
        # 0cb7485 to where node:sqlite is usable without a flag. It is here
        # because CI's per-PR matrix does not gate a release: without this leg
        # a floor-only regression publishes green and breaks exactly the users
        # least equipped to diagnose it. Do not drop it to simplify the matrix.
        node: ["22.13.0", "24.x"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # See ci.yml: under a solution tsconfig, `--noEmit` typechecks nothing.
      - run: npx tsc --build --force
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Versions are lockstep by rule, not by convention: all three packages
      # always carry the same number and always publish together. Checking every
      # one against the tag is what makes that true rather than aspirational —
      # a hand-bump that missed a package would otherwise publish a morse-ai
      # that resolves a version of the bus nobody tested it against.
      - name: Check every package version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$TAG" ]; then
              echo "$name is $version, tag is $TAG"
              fail=1
            fi
          done
          # And morse-ai must pin the other two exactly, at that same version,
          # so a published morse-ai can only ever resolve what it was tested with.
          deps=$(node -p "JSON.stringify(require('./packages/morse-ai/package.json').dependencies)")
          for dep in "@morse-ai/bus" "@morse-ai/registry"; do
            pinned=$(node -p "require('./packages/morse-ai/package.json').dependencies['$dep']")
            if [ "$pinned" != "$TAG" ]; then
              echo "morse-ai pins $dep at '$pinned', expected exactly '$TAG' (deps: $deps)"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "all three at $TAG, pinned exactly"

      # No NODE_AUTH_TOKEN: npm trusts this workflow's OIDC identity, configured
      # as a trusted publisher on each package. Provenance comes with it.
      #
      # Order matters and is irreversible. If morse-ai fails after the other two
      # have gone out, those versions exist and can never be republished — npm
      # burns a version permanently, even after an unpublish. Recovery is a
      # patch bump of all three, not a retry of this job.
      #
      # The sub-packages first, so morse-ai's exact pins are resolvable the
      # moment it lands. They have no dependency on each other, so their
      # relative order is free.
      - name: Publish @morse-ai/bus
        run: npm publish -w @morse-ai/bus --provenance --access public

      - name: Publish @morse-ai/registry
        run: npm publish -w @morse-ai/registry --provenance --access public

      - name: Publish morse-ai
        run: npm publish -w morse-ai --provenance --access public

      # A stub `latest` from the bootstrap publish is the normal starting state
      # for the two new packages; this is where it stops being true. Worth
      # printing rather than assuming, since `latest` is what `npm install`
      # resolves and nothing else in this job would notice it pointing at 0.0.0.
      - name: Report what `latest` now resolves to
        run: |
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            echo "$name -> $(npm view "$name" dist-tags.latest)"
          done
