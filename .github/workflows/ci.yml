name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.13.0 is the exact floor: node:sqlite exists from 22.5.0 but only
        # behind --experimental-sqlite, so pinning the true minimum is the only
        # way this matrix can catch an engines field that lies.
        node: ["22.13.0", "22.x", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # `--build`, not `--noEmit`. The root tsconfig is a solution file with
      # `files: []`, so `tsc --noEmit` has no inputs of its own and exits 0
      # without typechecking a single line — green, and measuring nothing.
      # `--force` stops a stale .tsbuildinfo from skipping the work.
      - run: npx tsc --build --force
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci

      # `npm test` globs test/*.test.js — one level, no recursion. A suite in
      # any subdirectory is therefore invisible to it, and invisible is not the
      # same as failing: the build stays green while the assertions never run.
      # This step names the omission instead of inheriting its silence.
      #
      # It is deliberately about where a file sits, not what it is called: a
      # staging directory, a rebase that drops the final `git mv`, a suite
      # tucked under a topic folder for tidiness all land the same way.
      - name: Fail if any test is outside the suite npm test runs
        run: |
          # helpers/ and fixtures/ are support files, not suites — they are
          # imported by the tests above them and are meant not to be globbed.
          stranded=$(find test -mindepth 2 -name '*.test.js' \
            -not -path 'test/helpers/*' -not -path 'test/fixtures/*')
          if [ -n "$stranded" ]; then
            echo "These suites do not match test/*.test.js, so npm test never"
            echo "runs them and CI cannot go red on what they assert:"
            echo
            echo "$stranded" | sed 's/^/  /'
            echo
            echo "This red means one of two things — the file list tells you which:"
            echo "  * a move is unfinished: bring them (and their fixtures) up"
            echo "    into test/, or delete them."
            echo "  * they assert a requirement nobody has implemented yet:"
            echo "    implement it, or drop the requirement. Promoting them"
            echo "    as-is would red the build for a missing feature."
            exit 1
          fi

      # Guards the promise that installing morse does not install six opinions
      # about what a product owner is.
      #
      # Runs per workspace rather than at the root: the root manifest is private
      # and `npm pack` refuses it outright, so a root-level check would fail for
      # a reason that has nothing to do with what it is guarding.
      - name: Verify no roles ship in any package
        run: |
          npm run build
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            echo "checking $name"
            npm pack --dry-run --json -w "$name" > /tmp/pack.json
            if grep -qiE '"path": *"(examples|test)/' /tmp/pack.json; then
              echo "examples/ or test/ leaked into $name"; exit 1
            fi
          done
          if grep -rqiE 'Product Owner|SecOps|threat-modelling' packages/*/dist/; then
            echo "role content leaked into a dist/"; exit 1
          fi

      # The two properties the package split exists to create. Neither shows up
      # as a test failure if it decays — the code keeps working, the design just
      # quietly stops being true — so they are asserted here instead.
      #
      # Pulled forward from the packaging phase on purpose: the file-backed
      # registry lands next, and "reach for a query" is exactly the temptation
      # it creates.
      - name: Verify the sub-packages stayed independent
        run: |
          for pkg in packages/registry packages/bus; do
            [ -d "$pkg" ] || continue
            name=$(node -p "require('./$pkg/package.json').name")
            deps=$(node -p "Object.keys(require('./$pkg/package.json').dependencies ?? {}).join(' ')")
            if [ -n "$deps" ]; then
              echo "$name must have zero dependencies, found: $deps"
              echo "The bus talks to a registry through an interface it defines"
              echo "itself, so neither package may depend on the other."
              exit 1
            fi
          done

          # Only the message log needs a database; the registry is plain files.
          if [ -d packages/registry/dist ] && grep -rq "node:sqlite" packages/registry/dist/; then
            echo "@morse-ai/registry loaded a database. Every agent record has"
            echo "exactly one writer, which is the whole reason it is files."
            exit 1
          fi

      # Guard 4 asserts independence from a manifest. This one executes it: an
      # import npm never sees — a bare specifier that happens to resolve inside
      # this workspace — passes the manifest check and fails here.
      - name: Verify each sub-package works installed on its own
        run: |
          set -e
          npm run build
          work=$(mktemp -d)
          for pkg in registry bus; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            bin=$(node -p "Object.keys(require('./packages/$pkg/package.json').bin)[0]")
            tarball=$(cd "packages/$pkg" && npm pack --silent --pack-destination "$work")
            mkdir -p "$work/$pkg" && (cd "$work/$pkg" && npm init -y >/dev/null && npm install --no-audit --no-fund "$work/$tarball" >/dev/null)
            echo "installed $name alone; running $bin"
            (cd "$work/$pkg" && ./node_modules/.bin/"$bin" --help > /dev/null)
          done

          # And a real round trip, with the bus explicitly told it has no registry.
          export MORSE_HOME="$work/state" MORSE_DB="$work/state/m.db" MORSE_ROOM=solo
          mkdir -p "$work/state"
          (cd "$work/bus" && ./node_modules/.bin/morse-bus --no-registry join a > /dev/null)
          (cd "$work/bus" && ./node_modules/.bin/morse-bus --no-registry join b > /dev/null)
          (cd "$work/bus" && ./node_modules/.bin/morse-bus --no-registry send b a "hello" > /dev/null)
          count=$(cd "$work/bus" && ./node_modules/.bin/morse-bus --no-registry inbox a | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).count")
          if [ "$count" != "1" ]; then
            echo "@morse-ai/bus could not deliver a message on its own (count=$count)"
            exit 1
          fi
          (cd "$work/registry" && ./node_modules/.bin/morse-registry publish a --role Tester > /dev/null)
          agents=$(cd "$work/registry" && ./node_modules/.bin/morse-registry list | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).agents.length")
          if [ "$agents" != "1" ]; then
            echo "@morse-ai/registry could not record an agent on its own (agents=$agents)"
            exit 1
          fi
          rm -rf "$work"
