name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.5 is the floor because node:sqlite does not exist before it; the
        # others are the maintained lines it has to keep working on.
        node: ["22.5.0", "22.x", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      # Guards the promise that installing morse does not install six opinions
      # about what a product owner is.
      - name: Verify no roles ship in the package
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if grep -qiE '"path": *"(examples|test)/' /tmp/pack.json; then
            echo "examples/ or test/ leaked into the package"; exit 1
          fi
          npm run build
          if grep -rqiE 'Product Owner|SecOps|threat-modelling' dist/; then
            echo "role content leaked into dist/"; exit 1
          fi
