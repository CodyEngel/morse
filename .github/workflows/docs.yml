name: Docs

# Checks for the documentation site at https://morse-ai.com.
#
# Deployment is deliberately not here. Cloudflare Workers Builds is connected to
# this repository and owns it: on a push it clones, runs `npm run docs:build`,
# then `npx wrangler deploy` (and `wrangler versions upload` for a preview URL on
# other branches). That is why there is no CLOUDFLARE_API_TOKEN secret and no
# deploy job — Cloudflare mints its own token for the build. wrangler.jsonc
# records the dashboard settings. Do not add a deploy step here without turning
# the git integration off first; two deployers racing over one Worker is worse
# than either alone.
#
# What is left is the part Cloudflare cannot do: fail a pull request. A build
# that only breaks after merge is a site that is already broken.
#
# `site/` is a separate npm project on purpose — deliberately outside the
# workspace `packages/*` glob, so `npm ci` at the root neither installs Astro nor
# lets a docs dependency reach the published packages. Hence the
# `working-directory: site` on every step below.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/docs.yml"
  # No path filter on pull requests, and that is the point: the sync job below
  # has to run precisely when a PR changed a documented surface and did *not*
  # touch site/.
  pull_request:

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: site
      # `build` also checks every internal link against what was emitted —
      # see site/scripts/check-links.mjs.
      - run: npm run build
        working-directory: site

  # Documentation that lags the code is worse than no documentation, because it
  # is believed. The README used to be the single surface, so drift was visible
  # in review; now the detail lives in site/, and a PR that changes a documented
  # surface without touching the docs is exactly the change nobody notices.
  #
  # This is a guard, not a style check: it names the surfaces the site actually
  # describes, and it can be answered either by updating the docs or by saying
  # in the PR body that they did not need updating.
  sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a documented surface changed without the docs
        env:
          BASE_REF: ${{ github.base_ref }}
          # Through the environment, never interpolated into the script: a PR
          # body is attacker-controlled text.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          # Full history is already checked out (fetch-depth: 0); this is only
          # to make sure the base branch ref itself exists locally, since the
          # three-dot diff below resolves the merge base from it.
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")

          # The surfaces the site documents page for page. Internals are not
          # listed: this fires on what a reader of the docs would notice.
          surfaces='^(README\.md|SECURITY\.md|packages/morse-ai/src/(prompt\.ts|cli/(main|agent)\.ts|mcp/tools\.ts)|packages/(bus|registry)/src/mcp\.ts|packages/registry/src/(roles|plugins|toml)\.ts)$'

          touched=$(echo "$changed" | grep -E "$surfaces" || true)
          docs=$(echo "$changed" | grep -E '^site/src/content/docs/' || true)

          if [ -z "$touched" ] || [ -n "$docs" ]; then
            echo "ok"
            exit 0
          fi

          case "$PR_BODY" in
            *"docs: n/a"*)
              echo "Docs skipped by request: the PR body says 'docs: n/a'."
              exit 0
              ;;
          esac

          echo "This PR changes a surface the docs site describes:"
          echo
          echo "$touched" | sed 's/^/  /'
          echo
          echo "but nothing under site/src/content/docs/ changed. The site is the"
          echo "reference now — the README only links to it — so a change here that"
          echo "does not land there is a page that quietly starts lying."
          echo
          echo "Fix it one of two ways:"
          echo "  * update the matching page(s) under site/src/content/docs/, or"
          echo "  * put 'docs: n/a' in the PR body if the change genuinely is not"
          echo "    described anywhere on the site."
          echo
          echo "AGENTS.md maps each surface to the page that documents it."
          exit 1
